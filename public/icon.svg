<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="emGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe padding -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="4" />

  <!-- Inner circle accent -->
  <circle cx="256" cy="256" r="170" fill="#0f172a" stroke="#059669" stroke-width="6" stroke-opacity="0.4" />
  
  <!-- Financial Pulse Wave behind glyph -->
  <path d="M 120 280 L 190 280 L 220 240 L 250 320 L 285 220 L 315 295 L 340 280 L 392 280" 
        fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" />

  <!-- Rupee Symbol ₹ -->
  <!-- Top horizontal bar -->
  <rect x="176" y="168" width="160" height="24" rx="12" fill="url(#emGradient)" filter="url(#glow)" />
  <!-- Second horizontal bar -->
  <rect x="176" y="212" width="128" height="22" rx="11" fill="url(#emGradient)" />
  
  <!-- Curved top right loop -->
  <path d="M 230 190 Q 320 190 320 250 Q 320 295 240 295 L 206 295" 
        fill="none" stroke="url(#emGradient)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
        
  <!-- Diagonal leg down right -->
  <line x1="228" y1="288" x2="316" y2="384" 
        stroke="url(#emGradient)" stroke-width="24" stroke-linecap="round" />
        
  <!-- Vertical stem -->
  <line x1="226" y1="168" x2="226" y2="310" 
        stroke="url(#emGradient)" stroke-width="22" stroke-linecap="round" />

  <!-- Sparkle dot -->
  <circle cx="340" cy="156" r="8" fill="#6ee7b7" filter="url(#glow)" />
</svg>
